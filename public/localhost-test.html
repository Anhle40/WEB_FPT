<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localhost Firebase Test</title>
</head>
<body>
    <h1>🔥 Localhost Firebase Test</h1>
    <button onclick="testFirebase()">Test Firebase Connection</button>
    <button onclick="testGoogleLogin()">Test Google Login</button>
    <div id="result"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQUBMtNTl6AJoeLmHmGmH_v5eIiJcMXPQ",
            authDomain: "anh-3ec3f.firebaseapp.com",
            projectId: "anh-3ec3f",
            storageBucket: "anh-3ec3f.firebasestorage.app",
            messagingSenderId: "791025660502",
            appId: "1:791025660502:web:fc9d5c9a97a34f8b1341f7",
            measurementId: "G-6CKF33964S"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Configure Auth for testing
        auth.settings = {
            appVerificationDisabledForTesting: true
        };

        provider.addScope('email');
        provider.addScope('profile');

        window.testFirebase = function() {
            document.getElementById('result').innerHTML = '✅ Firebase initialized successfully!';
            console.log('✅ Firebase test passed');
        };

        window.testGoogleLogin = async function() {
            try {
                console.log('🔥 Starting Google login...');
                const result = await signInWithPopup(auth, provider);
                document.getElementById('result').innerHTML = '✅ Google login successful! User: ' + result.user.displayName;
                console.log('✅ Google login test passed:', result.user);
            } catch (error) {
                console.error('❌ Google login test failed:', error);
                document.getElementById('result').innerHTML = '❌ Error: ' + error.code + ' - ' + error.message;
            }
        };
    </script>
</body>
</html>
