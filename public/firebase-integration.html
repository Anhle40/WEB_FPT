<!-- 🔥 Firebase Integration Script -->
<!-- Script này sẽ được inject vào app.html để tích hợp Firebase -->

<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-analytics.js";
  import { getDatabase, ref, set, get, update, remove } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCQUBMtNTl6AJoeLmHmGmH_v5eIiJcMXPQ",
    authDomain: "anh-3ec3f.firebaseapp.com",
    projectId: "anh-3ec3f",
    storageBucket: "anh-3ec3f.firebasestorage.app",
    messagingSenderId: "791025660502",
    appId: "1:791025660502:web:fc9d5c9a97a34f8b1341f7",
    measurementId: "G-6CKF33964S",
    databaseURL: "https://anh-3ec3f-default-rtdb.firebaseio.com/"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const database = getDatabase(app);

  // Make database available globally
  window.database = database;
  window.firebaseApp = app;

  console.log('🔥 Firebase initialized successfully!');
  console.log('📊 Database connected:', database);

  // 🔄 Sync localStorage với Firebase
  function getCurrentUserId() {
    const user = JSON.parse(localStorage.getItem('fptu_user_session') || '{}');
    return user.mssv || user.name?.replace(/\s/g, '') || 'anonymous';
  }

  // Override localStorage.setItem để sync với Firebase
  const originalSetItem = localStorage.setItem;
  localStorage.setItem = function(key, value) {
    // Gọi hàm gốc trước
    originalSetItem.call(this, key, value);
    
    // Sync với Firebase cho các key quan trọng
    if (key === 'fptu_user_session') {
      syncUserToFirebase(value);
    } else if (key === 'eisenhowerTasks') {
      syncTasksToFirebase(value);
    } else if (key === 'calc_history') {
      syncCalcHistoryToFirebase(value);
    }
  };

  // Sync functions
  async function syncUserToFirebase(userStr) {
    try {
      const user = JSON.parse(userStr);
      const userId = user.mssv || user.name?.replace(/\s/g, '') || 'anonymous';
      
      const userRef = ref(database, `users/${userId}`);
      await set(userRef, {
        ...user,
        lastLogin: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      });
      
      console.log('✅ User synced to Firebase:', userId);
    } catch (e) { 
      console.error('❌ Error syncing user:', e); 
    }
  }
  
  async function syncTasksToFirebase(tasksStr) {
    try {
      const tasks = JSON.parse(tasksStr);
      const userId = getCurrentUserId();
      
      const tasksRef = ref(database, `tasks/${userId}`);
      await set(tasksRef, tasks);
      
      console.log('✅ Tasks synced to Firebase for user:', userId);
    } catch (e) { 
      console.error('❌ Error syncing tasks:', e); 
    }
  }
  
  async function syncCalcHistoryToFirebase(historyStr) {
    try {
      const history = JSON.parse(historyStr);
      const userId = getCurrentUserId();
      
      const historyRef = ref(database, `calcHistory/${userId}`);
      await set(historyRef, history);
      
      console.log('✅ Calc history synced to Firebase for user:', userId);
    } catch (e) { 
      console.error('❌ Error syncing calc history:', e); 
    }
  }

  // Helper functions
  window.firebaseHelpers = {
    getCurrentUserId,
    syncUserToFirebase,
    syncTasksToFirebase,
    syncCalcHistoryToFirebase,
    
    // Database operations
    async saveData(path, data) {
      try {
        const dbRef = ref(database, path);
        await set(dbRef, data);
        console.log('✅ Data saved to Firebase:', path);
        return true;
      } catch (e) {
        console.error('❌ Error saving data:', e);
        return false;
      }
    },
    
    async getData(path) {
      try {
        const dbRef = ref(database, path);
        const snapshot = await get(dbRef);
        return snapshot.exists() ? snapshot.val() : null;
      } catch (e) {
        console.error('❌ Error getting data:', e);
        return null;
      }
    },
    
    async updateData(path, updates) {
      try {
        const dbRef = ref(database, path);
        await update(dbRef, updates);
        console.log('✅ Data updated in Firebase:', path);
        return true;
      } catch (e) {
        console.error('❌ Error updating data:', e);
        return false;
      }
    },
    
    async deleteData(path) {
      try {
        const dbRef = ref(database, path);
        await remove(dbRef);
        console.log('✅ Data deleted from Firebase:', path);
        return true;
      } catch (e) {
        console.error('❌ Error deleting data:', e);
        return false;
      }
    }
  };

  console.log('🔄 Firebase sync helpers ready');
</script>
