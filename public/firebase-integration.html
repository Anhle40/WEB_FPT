<!-- 🔥 Firebase Integration Script -->
<!-- Script này sẽ được inject vào app.html để tích hợp Firebase -->

<script>
  // Firebase configuration - sử dụng global namespace từ firebase-auth.js
  console.log('🔥 Firebase integration loaded');
  
  // Đợi cho Firebase được khởi tạo từ firebase-auth.js
  setTimeout(() => {
    if (typeof firebase !== 'undefined') {
      console.log('✅ Firebase is available from firebase-auth.js');
    } else {
      console.warn('⚠️ Firebase not found - make sure firebase-auth.js is loaded first');
    }
  }, 1000);
</script>
